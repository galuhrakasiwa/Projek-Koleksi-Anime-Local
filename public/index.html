<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Anime Local Catalog</title>

  <style>
    :root {
      --bg: #070a12;
      --bg-soft: #0f1524;
      --card: #151d2d;
      --card-hover: #202b43;
      --text: #f8fafc;
      --muted: #a9b4c7;
      --accent: #e50914;
      --accent-2: #7c3aed;
      --green: #22c55e;
      --yellow: #facc15;
      --border: rgba(255, 255, 255, 0.09);
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        radial-gradient(circle at top left, rgba(229, 9, 20, 0.2), transparent 28%),
        radial-gradient(circle at top right, rgba(124, 58, 237, 0.16), transparent 32%),
        linear-gradient(180deg, #070a12, #0b1020 55%, #070a12);
      color: var(--text);
    }

    .app {
      width: min(1450px, 94%);
      margin: 0 auto;
      padding: 34px 0 70px;
    }

    .hero {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 24px;
      align-items: end;
      margin-bottom: 26px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.05);
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 16px;
    }

    .hero h1 {
      margin: 0;
      font-size: clamp(34px, 6vw, 64px);
      line-height: 0.95;
      letter-spacing: -2px;
    }

    .hero h1 span {
      color: var(--accent);
    }

    .hero p {
      margin: 16px 0 0;
      color: var(--muted);
      line-height: 1.7;
      max-width: 720px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 150px);
      gap: 12px;
    }

    .stat-card {
      border: 1px solid var(--border);
      background: rgba(255, 255, 255, 0.055);
      border-radius: 22px;
      padding: 18px;
      box-shadow: 0 18px 50px var(--shadow);
      backdrop-filter: blur(14px);
    }

    .stat-card strong {
      display: block;
      font-size: 30px;
      line-height: 1;
      margin-bottom: 8px;
    }

    .stat-card span {
      color: var(--muted);
      font-size: 12px;
    }

    .controls {
      position: sticky;
      top: 0;
      z-index: 30;
      padding: 16px 0 22px;
      background: linear-gradient(to bottom, rgba(7, 10, 18, 0.98), rgba(7, 10, 18, 0.82));
      backdrop-filter: blur(14px);
    }

    .status-tabs {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }

    .tab-btn {
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 11px 16px;
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
      cursor: pointer;
      font-weight: 700;
      transition: 0.2s ease;
    }

    .tab-btn:hover {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.1);
    }

    .tab-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 0 5px rgba(229, 9, 20, 0.16);
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr 250px auto;
      gap: 12px;
    }

    .search-box,
    .genre-select,
    .refresh-btn {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 17px;
      background: rgba(255, 255, 255, 0.065);
      color: var(--text);
      padding: 15px 16px;
      outline: none;
      font-size: 15px;
    }

    .genre-select option {
      background: var(--bg-soft);
      color: var(--text);
    }

    .search-box:focus,
    .genre-select:focus {
      border-color: rgba(229, 9, 20, 0.75);
      box-shadow: 0 0 0 5px rgba(229, 9, 20, 0.15);
    }

    .refresh-btn {
      cursor: pointer;
      background: linear-gradient(135deg, var(--accent), #ff3540);
      border-color: rgba(255, 255, 255, 0.12);
      font-weight: 800;
      white-space: nowrap;
      transition: 0.2s ease;
    }

    .refresh-btn:hover {
      transform: translateY(-1px);
      filter: brightness(1.08);
    }

    .status-area {
      margin-top: 22px;
      padding: 38px;
      border: 1px solid var(--border);
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.055);
      color: var(--muted);
      text-align: center;
    }

    .status-area.error {
      color: #fecaca;
      border-color: rgba(248, 113, 113, 0.38);
      background: rgba(127, 29, 29, 0.25);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
      gap: 22px;
      margin-top: 8px;
    }

    .card {
      position: relative;
      overflow: hidden;
      border-radius: 24px;
      background: linear-gradient(180deg, var(--card), #0c1220);
      border: 1px solid var(--border);
      box-shadow: 0 22px 60px var(--shadow);
      transition: 0.25s ease;
    }

    .card:hover {
      transform: translateY(-8px);
      background: linear-gradient(180deg, var(--card-hover), #0e1424);
    }

    .poster-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 2 / 3;
      background: #111827;
      overflow: hidden;
    }

    .poster {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: 0.35s ease;
    }

    .card:hover .poster {
      transform: scale(1.06);
    }

    .poster-fallback {
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 24px;
      color: var(--muted);
      background:
        radial-gradient(circle at top, rgba(229, 9, 20, 0.18), transparent 40%),
        #111827;
    }

    .score-badge,
    .watch-badge {
      position: absolute;
      z-index: 2;
      border-radius: 999px;
      backdrop-filter: blur(10px);
      font-size: 12px;
      font-weight: 900;
    }

    .score-badge {
      right: 12px;
      top: 12px;
      padding: 8px 10px;
      color: var(--yellow);
      background: rgba(0, 0, 0, 0.7);
    }

    .watch-badge {
      left: 12px;
      top: 12px;
      padding: 8px 10px;
      color: white;
    }

    .watch-badge.watched {
      background: rgba(34, 197, 94, 0.9);
    }

    .watch-badge.unwatched {
      background: rgba(124, 58, 237, 0.9);
    }

    .content {
      padding: 17px;
    }

    .title {
      margin: 0 0 10px;
      font-size: 18px;
      line-height: 1.35;
      letter-spacing: -0.25px;
    }

    .folder {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 12px;
      word-break: break-word;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 13px;
    }

    .chip {
      font-size: 11px;
      color: #dbeafe;
      padding: 6px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.075);
      border: 1px solid var(--border);
    }

    .synopsis {
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.58;
      min-height: 103px;
      display: -webkit-box;
      -webkit-line-clamp: 5;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .footer {
      margin-top: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      color: var(--muted);
      font-size: 12px;
    }

    .mal-link {
      text-decoration: none;
      color: white;
      font-weight: 800;
      padding: 8px 11px;
      border-radius: 999px;
      background: rgba(229, 9, 20, 0.2);
      border: 1px solid rgba(229, 9, 20, 0.28);
    }

    .mal-link:hover {
      background: var(--accent);
    }

    @media (max-width: 1050px) {
      .hero {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    @media (max-width: 760px) {
      .controls {
        position: static;
      }

      .filter-row {
        grid-template-columns: 1fr;
      }

      .stats {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        letter-spacing: -1px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <section class="hero">
      <div>
        <div class="eyebrow">Localhost Anime Library</div>
        <h1>Anime <span>Catalog</span></h1>
        <p>
          Membaca koleksi dari D:/ANIME dan D:/UN, lalu melengkapi poster,
          sinopsis, genre, dan rating memakai Jikan API dengan cache lokal.
        </p>
      </div>

      <div class="stats">
        <div class="stat-card">
          <strong id="totalAnime">0</strong>
          <span>Total Anime</span>
        </div>
        <div class="stat-card">
          <strong id="watchedAnime">0</strong>
          <span>Sudah Ditonton</span>
        </div>
        <div class="stat-card">
          <strong id="unwatchedAnime">0</strong>
          <span>Belum Ditonton</span>
        </div>
      </div>
    </section>

    <section class="controls">
      <div class="status-tabs">
        <button class="tab-btn active" data-status="all">Semua Anime</button>
        <button class="tab-btn" data-status="Sudah Ditonton">Sudah Ditonton</button>
        <button class="tab-btn" data-status="Belum Ditonton">Belum Ditonton</button>
      </div>

      <div class="filter-row">
        <input
          id="searchInput"
          class="search-box"
          type="text"
          placeholder="Cari judul anime..."
          autocomplete="off"
        />

        <select id="genreFilter" class="genre-select">
          <option value="all">Semua Genre</option>
        </select>

        <button id="refreshBtn" class="refresh-btn">Reset Cache</button>
      </div>
    </section>

    <section id="statusArea" class="status-area">
      Membaca folder anime...
    </section>

    <section id="animeGrid" class="grid"></section>
  </main>

  <script src="script.js"></script>
</body>
</html>
